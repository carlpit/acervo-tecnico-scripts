[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vigas-nbr6118"
version = "0.1.0"
description = "Dimensionamento de vigas de concreto armado à flexão simples (NBR 6118), com memorial em Markdown."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Carlos Vinicius" }]
dependencies = ["typer>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
vigas = "vigas_nbr6118.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vigas_nbr6118"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=vigas_nbr6118 --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP045", "UP007"]

[tool.ruff.lint.per-file-ignores]
"src/vigas_nbr6118/memorial.py" = ["E501"]
