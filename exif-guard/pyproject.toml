[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "exif-guard"
version = "0.1.0"
description = "Audita metadados EXIF de fotos próprias, calcula risco de privacidade e gera cópias sem metadados."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Carlos Vinicius" }]
dependencies = [
    "Pillow>=10.0",
    "piexif>=1.1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
exif-guard = "exif_guard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/exif_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=exif_guard --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
